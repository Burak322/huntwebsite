[project]
name = "clan-management-website"
version = "0.1.0"
description = "Tek yöneticiye yönelik klan yönetim, oyuncu gelişim, düello OCR ve dinamik günlük limit sistemi"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9,<3.0",
    "rapidocr-onnxruntime>=1.4,<2.0",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "numpy>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "playwright>=1.49",
    "pytest-playwright>=0.6",
]

[tool.uv]
package = false
exclude-dependencies = [
    "opencv-python",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
